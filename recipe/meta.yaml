{% set name = "synphot" %}
{% set version = "1.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3ca81585a61379886c1b3e1c09062352645fc7a51ba04f183ea458b671907da6

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  skip: true  # [py<311]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - pip
    - python
    - setuptools
    - setuptools_scm
    - numpy
    - extension-helpers
  run:
    - python
    - scipy
    - astropy-base

test:
  imports:
    - synphot

about:
  home: https://www.github.com/spacetelescope/synphot_refactor
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: Synthetic photometry
  description: |
    This is a replacement for IRAF STSDAS SYNPHOT and ASTROLIB PYSYNPHOT,
    utilizing Astropy and covering the non-instrument specific portions of
    the old packages.
  doc_url: https://synphot.readthedocs.io
  dev_url: https://www.github.com/spacetelescope/synphot_refactor

extra:
  recipe-maintainers:
    - mwcraig
    - pllim
